name: iOS Simulator

on:
  pull_request:
    branches: [codex/ios-dev, main]

permissions:
  contents: read

jobs:
  cold-start:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - run: npm ci
      - run: npm run prebuild:ios -- --no-install
      - run: pod install --project-directory=ios

      - name: Boot an available iPhone
        run: |
          udid=$(xcrun simctl list -j devices available | jq -er '
            [.devices | to_entries[] | select(.key | contains(".iOS-")) | .value[]
             | select(.deviceTypeIdentifier | contains(".iPhone-"))][0].udid // empty')
          xcrun simctl bootstatus "$udid" -b
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"

      - name: Build and install the standalone app
        run: |
          xcodebuild -quiet -workspace ios/SyncClipboard.xcworkspace -scheme SyncClipboard \
            -configuration Release -destination "id=$SIMULATOR_UDID" \
            -derivedDataPath "$RUNNER_TEMP/ios-build" build
          xcrun simctl install "$SIMULATOR_UDID" "$RUNNER_TEMP/ios-build/Build/Products/Release-iphonesimulator/SyncClipboard.app"

      - name: Open Home, History and Settings on a fresh install
        env:
          MAESTRO_CLI_NO_ANALYTICS: '1'
        run: |
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/maestro.zip" \
            https://github.com/mobile-dev-inc/maestro/releases/download/cli-2.12.1/maestro.zip
          echo "54dbb0716425626604973cbb374c585ca30272375d9ce15177a1152765ddd9d7  $RUNNER_TEMP/maestro.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/maestro.zip" -d "$RUNNER_TEMP"
          "$RUNNER_TEMP/maestro/bin/maestro" --device "$SIMULATOR_UDID" test .maestro/ios-cold-start.yaml
